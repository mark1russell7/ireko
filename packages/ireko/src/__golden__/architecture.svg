<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 872 380" width="872" height="380" role="img" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, sans-serif" font-size="13">
<title>System architecture</title>
