# The work of each night: the benchmarks of the engine (docs/REVIEW.md §9, L9).
#   bench   the benchmarks of packages/ireko/src/core/engine.bench.ts, as a table in the summary of the run
# The benchmarks measure and do not fail. Compare the tables of two nights to find a change of the speed.
name: Nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The benchmarks
        run: |
          pnpm --filter ireko bench | tee bench.txt
          {
            echo "## The benchmarks of the engine"
            echo
            echo '```text'
            grep -E "name|^ +[a-z]" bench.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench
          path: bench.txt
          retention-days: 90
