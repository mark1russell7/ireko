# The deployment of the site to GitHub Pages, at https://mark1russell7.github.io/<repository>/.
#   build   the site, with the base path from the name of the repository, and the share cards
#   deploy  the upload to Pages
# The deployment starts after a green CI run of a push to the main branch. It can also start by hand.
# The Pages source of the repository must be "GitHub Actions" (Settings > Pages).
name: Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

permissions: {}

# One deployment at a time. A deployment that started always completes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The build installs and runs the code of the repository, so it gets only "contents: read".
  build:
    # A CI run for a pull request does not deploy. Only a green CI run of a push deploys.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit that CI examined
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # The whole history: the sitemap gets the date of each page from its last commit.
          fetch-depth: 0
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the site
        run: pnpm --filter @ireko/site build
        env:
          # A new name of the repository gives a new base path, with no change to the code.
          SITE_BASE: ${{ github.event.repository.name }}
          ASTRO_TELEMETRY_DISABLED: "1"
      - name: The version of Playwright
        id: playwright
        run: echo "version=$(node -p "require('./packages/site/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Chromium draws the share cards.
      - run: pnpm --filter @ireko/site exec playwright install --with-deps chromium
      - run: pnpm --filter @ireko/site og
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/site/dist

  # The deployment runs no code of the repository. Only this job can write to Pages.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
