# The gates of each change.
#   node    the Node.js version of .nvmrc, for the release check of the job ci
#   ci      the shared CI of the template (reusable-ci.yml, its CI.md): the scripts on each supported Node.js version,
#           the size budgets and the smoke test of the package, and the release check on a pull request
#   site    the type check and the build of the site, the share cards and the browser tests
#   bytes   each committed module of Vex equals the print of the pinned commit of vex
#   ci-ok   the one check that a pull request must pass
# release.yml calls this workflow before it builds a release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions: {}

# A new push to a pull request cancels the old run. Each commit on main gets its full run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The release build of release.yml reads .nvmrc (its input node-version-file). The release check of the job ci gets
  # the same version from this job, so the two cannot drift.
  node:
    name: Node.js version of the release build
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      version: ${{ steps.nvmrc.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .nvmrc
          sparse-checkout-cone-mode: false
      - id: nvmrc
        run: echo "version=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"

  ci:
    needs: node
    permissions:
      contents: read
    uses: mark1russell7/template/.github/workflows/reusable-ci.yml@7c83f30551e066c06852ea75bf0140eadfc49961 # main
    with:
      # 22.12 is the floor of "engines".
      node-versions: '["22.12", "24", "26"]'
      # The type check, Oxlint, the conventions, the tests, the build, the API report and the writing rules (ASD-STE100).
      # The build comes before check:api, because the API report reads the built declarations.
      scripts: typecheck lint check:conventions test build check:api lint:ste
      # The budgets of .size-limit.json, then pnpm pack, publint, attw, an install in an empty project, plain Node.js
      # and two TypeScript consumers. The two commands read the build of the scripts.
      run: |
        pnpm size
        pnpm --filter ireko smoke
      # The tests with coverage, with the thresholds of vitest.config.ts, on each pull request. A failure fails the CI,
      # as pnpm test:coverage did in the old job check. The artifact coverage has the reports.
      coverage: true
      # The release check runs the build of release.yml. That file gives no input build, so the default build runs.
      release-build: ""
      release-node-version: ${{ needs.node.outputs.version }}

  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: the sitemap gets the date of each page from its last commit.
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The generated types of Astro (astro sync), then the type check of the site and of its browser tests
      - run: pnpm --filter @ireko/site typecheck
      - name: Build the site
        run: pnpm --filter @ireko/site build
        env:
          SITE_BASE: ireko
          ASTRO_TELEMETRY_DISABLED: "1"
      # Chromium and its system libraries, from a cache, with a time limit and one more try. The share cards and the
      # browser tests use it. The command gives the Playwright version of the site.
      - uses: mark1russell7/template/.github/actions/setup-playwright@7c83f30551e066c06852ea75bf0140eadfc49961 # main
        with:
          browsers: chromium
          command: pnpm --filter @ireko/site exec playwright
      # One share card (1200 by 630) for each page, in dist/og
      - run: pnpm --filter @ireko/site og
      # The smoke tests, the head of each page, axe in both themes and the budgets (packages/site/e2e)
      - run: pnpm --filter @ireko/site test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            packages/site/playwright-report
            packages/site/test-results
          retention-days: 7

  # To move the pin, change both lines and print the files again in one pull request. Then the size budgets read the change.
  bytes:
    name: Module bytes
    permissions:
      contents: read
    uses: metrograph-labs/vex/.github/workflows/module-bytes.yml@ead65a70bde9f31b9fef4a8cc35cb69289167298 # main
    with:
      vex-ref: ead65a70bde9f31b9fef4a8cc35cb69289167298

  # The summary check of the ruleset of main: each job passed (CI.md of the template, "The check of the ruleset").
  # The release check is a job inside ci, so a skip of it on a push does not make ci skipped.
  ci-ok:
    name: CI OK
    if: ${{ !cancelled() }}
    needs: [ci, site, bytes]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@7c83f30551e066c06852ea75bf0140eadfc49961 # main
        with:
          needs: ${{ toJSON(needs) }}
