# The security scans of this repository: dependency review, osv-scanner and CodeQL (CI.md of
# mark1russell7/template). A pull request fails only for a new finding at or above high. Pushes to
# main and the weekly scan upload the findings to the Security tab.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "38 5 * * 1"
  workflow_dispatch:

permissions: {}

# Each pull request has its own group, and a newer push cancels its run. Each push to main has the group of its
# commit, so each commit of main gets its result.
concurrency:
  group: security-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-ok:
    name: Security OK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: mark1russell7/template/.github/actions/security-scan@b00e6c77be906feac2a505888bab26be99d5c4c5 # main
