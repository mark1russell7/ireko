# The standard npm release of mark1russell7/template, with the extra jobs of ireko.
#
#   verify          The gates of ci.yml: the checks, the package and the site.
#   build           Builds and packs each published package (scripts/release/pack.mjs), checks that
#                   CHANGELOG.md has a section for the version, and tests the size and the tarball.
#   publish         Publishes each tarball whose version npm does not have. Only this job holds
#                   "id-token: write", and it runs no code of the repository.
#   github-release  Makes the tag v<version> and the GitHub release with the section of CHANGELOG.md.
#
# A release: change the version in packages/ireko/package.json, add its section to CHANGELOG.md,
# and merge both to main. The workflow also starts by hand (workflow_dispatch), for example after a
# failure. It skips each version that is already on npm. github-release runs when publish
# published ireko, or when the owner starts the workflow by hand. It skips a release that exists.
#
# npm trusted publishing uses the OIDC token of GitHub Actions: no npm token, and each version
# gets a provenance statement. The trusted publisher of ireko names the repository
# mark1russell7/ireko and the workflow file release.yml, with NO environment (npm refuses an
# environment for a repository with the immutable OIDC subject, npm/cli#9969). A version with a
# hyphen (0.2.0-beta.1) gets the dist-tag "next". The others get "latest".
#
# npm trusts a workflow only for a package that exists. The owner bootstraps a new package once:
# scripts/release/npm-bootstrap.mjs (RELEASING.md tells the procedure).
name: Release

on:
  push:
    branches: [main]
    paths: ["package.json", "packages/*/package.json"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build and pack
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The version and its section in CHANGELOG.md
        id: version
        run: |
          version="$(node -p 'require("./packages/ireko/package.json").version')"
          # A prerelease (0.2.0-beta.1) goes to the npm tag "next", and each other version to "latest".
          case "$version" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          node packages/ireko/scripts/changelog.mjs "$version" > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache: a release installs from the registry and the lockfile only.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # The build script of the root package.json, or else the build script of each package
      - name: Build
        run: |
          if node -e 'process.exit(require("./package.json").scripts?.build ? 0 : 1)'; then
            pnpm run build
          else
            pnpm -r --if-present run build
          fi
      - run: pnpm size
      # pnpm writes the publishConfig entry points (dist/) into the packed package.json.
      - run: node scripts/release/pack.mjs "$RUNNER_TEMP/release"
      - name: Test the tarball that goes to npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node packages/ireko/scripts/smoke.mjs --tarball "$RUNNER_TEMP/release/ireko-$VERSION.tgz"
      - name: The release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node packages/ireko/scripts/changelog.mjs "$VERSION" > "$RUNNER_TEMP/release/notes.md"
          ls -l "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
    outputs:
      # "name@version" of each version that this run published, with a space before and after each one
      published: ${{ steps.publish.outputs.published }}
    steps:
      # No registry-url: with it, setup-node writes `_authToken=${NODE_AUTH_TOKEN}` to an .npmrc,
      # and that empty token can stop the OIDC exchange. The default registry is npmjs.org.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          package-manager-cache: false
      - name: npm is 11.5.1 or later
        run: |
          npm_version="$(npm --version)"
          if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$npm_version"; then
            echo "::error::npm $npm_version cannot do trusted publishing. It must be 11.5.1 or later."
            exit 1
          fi
          echo "npm $npm_version"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      # packages.txt has one line for each tarball, "name version file", in the sequence of their
      # dependencies. npm publishes each tarball as it is, with no package scripts. The path starts
      # with ./ because npm reads "release/x.tgz" as a GitHub repository (user/repo).
      # npm limits the requests of one account (HTTP 429). The step does not let npm send a
      # request again by itself, and it waits before it tries a publish again.
      - name: Publish
        id: publish
        shell: bash
        run: |
          set -o pipefail
          new_packages=()
          published=" "
          while read -r name version file; do
            [ -n "$name" ] || continue
            status=$(curl -sS -o packument.json -w '%{http_code}' "https://registry.npmjs.org/${name//\//%2f}")
            if [ "$status" = "404" ]; then
              new_packages+=("$name")
              continue
            elif [ "$status" != "200" ]; then
              echo "::error::The registry gave HTTP $status for $name."
              exit 1
            fi
            if node -e 'process.exit(require("./packument.json").versions?.[process.argv[1]] ? 0 : 1)' "$version"; then
              echo "$name $version is on npm."
              continue
            fi
            tag=latest
            case "$version" in *-*) tag=next ;; esac
            for attempt in 1 2 3; do
              if npm publish "./release/$file" --access public --provenance --tag "$tag" --fetch-retries 0 2>&1 | tee publish.log; then
                published+="$name@$version "
                echo "published=$published" >> "$GITHUB_OUTPUT"
                break
              fi
              if ! grep -q "E429" publish.log || [ "$attempt" = 3 ]; then
                echo "::error::npm did not publish $name $version."
                exit 1
              fi
              echo "npm limits the requests (429). The next try starts in $((attempt * 60)) seconds."
              sleep $((attempt * 60))
            done
          done < release/packages.txt
          echo "published=$published" >> "$GITHUB_OUTPUT"
          if [ ${#new_packages[@]} -gt 0 ]; then
            echo "::error::These packages are not on npm: ${new_packages[*]}. The owner bootstraps each new package once (RELEASING.md), then starts this workflow again."
            exit 1
          fi

  github-release:
    name: GitHub release
    needs: [build, publish]
    if: contains(needs.publish.outputs.published, format(' ireko@{0} ', needs.build.outputs.version)) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      DIST_TAG: ${{ needs.build.outputs.dist-tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      # No version tag starts this workflow, so this job makes the tag v<version> on the released commit.
      - name: Make the tag and the release
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The release v$VERSION exists. Nothing to do."
            exit 0
          fi
          prerelease=()
          if [ "$DIST_TAG" = next ]; then prerelease=(--prerelease); fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "ireko $VERSION" --notes-file release/notes.md "${prerelease[@]}" \
            "release/ireko-$VERSION.tgz"
