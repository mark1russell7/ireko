# Publishes ireko when the owner pushes a version tag (for example v0.1.1) on main.
#
#   preflight       The tag is on main and agrees with the version, and CHANGELOG.md has its section.
#   verify          The gates of ci.yml: the checks, the package and the site.
#   build           Builds and packs the tarball, tests that tarball, and uploads it with the notes.
#   publish         Publishes that tarball to npm. Only this job holds "id-token: write",
#                   and it runs no code of the repository: no checkout, no install, no build.
#   github-release  Makes the GitHub release with the section of CHANGELOG.md and the tarball.
#
# npm trusted publishing uses the OIDC token of GitHub Actions, so the workflow needs no npm token,
# and the package gets a provenance statement. On npmjs.com the trusted publisher of ireko names
# the repository mark1russell7/ireko, the workflow file release.yml and the environment npm.
#
# The rules of npm in 2026 (docs/REVIEW.md, section 10.2):
#   - npm accepts a trusted publisher only for a package that exists. Thus the owner publishes the
#     first version (0.1.0) by hand, with two-factor authentication. A tag for a version that is
#     already on npm skips the npm publish and does the other steps.
#   - Since 2026-10-02, a trusted-publisher configuration expires when no publish uses it in 48 hours.
#     Thus push the tag of the next patch version (0.1.1) in 48 hours after the configuration.
#   - A configuration made after 2026-09-03 permits only staged publishing by default.
#     Select "npm publish" as a permitted action in the configuration.
#   - After the first publish from this workflow, set "Require 2FA and disallow tokens" on the package.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    name: The tag, the version and the notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
    steps:
      # fetch-depth 0 fetches the history of all branches, so origin/main is there.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main."
            exit 1
          fi
      - name: The tag agrees with the version of the package
        id: version
        run: |
          version="$(node -p 'require("./packages/ireko/package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, and package.json has the version $version."
            exit 1
          fi
          # A prerelease (0.2.0-beta.1) goes to the npm tag "next", and each other version to "latest".
          case "$version" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"
      - name: CHANGELOG.md has a section for the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node packages/ireko/scripts/changelog.mjs "$VERSION"

  verify:
    name: CI
    needs: preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build and pack
    needs: [preflight, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache: a release installs from the registry and the lockfile only.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm size
      # pnpm writes the publishConfig entry points (dist/) into the packed package.json.
      - run: pnpm --filter ireko pack --pack-destination "$RUNNER_TEMP/release"
      - name: Test the tarball that goes to npm
        run: node packages/ireko/scripts/smoke.mjs --tarball "$RUNNER_TEMP/release/ireko-$VERSION.tgz"
      - name: The release notes
        run: |
          node packages/ireko/scripts/changelog.mjs "$VERSION" > "$RUNNER_TEMP/release/notes.md"
          ls -l "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to npm
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/ireko
    permissions:
      id-token: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      DIST_TAG: ${{ needs.preflight.outputs.dist-tag }}
    steps:
      # The npm of Node.js 24 is 11.5.1 or later, which trusted publishing needs. No other npm is installed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: npm is 11.5.1 or later
        run: |
          npm_version="$(npm --version)"
          if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$npm_version"; then
            echo "::error::npm $npm_version cannot do trusted publishing. It must be 11.5.1 or later."
            exit 1
          fi
          echo "npm $npm_version"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      # npm publishes the tarball as it is, with no package scripts.
      - name: Publish
        run: |
          if npm view "ireko@$VERSION" version >/dev/null 2>&1; then
            echo "ireko $VERSION is already on npm. Nothing to publish."
            exit 0
          fi
          npm publish "release/ireko-$VERSION.tgz" --provenance --access public --tag "$DIST_TAG"

  github-release:
    name: GitHub release
    needs: [preflight, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      DIST_TAG: ${{ needs.preflight.outputs.dist-tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - name: Make the release
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME exists. Nothing to do."
            exit 0
          fi
          prerelease=()
          if [ "$DIST_TAG" = next ]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "ireko $VERSION" --notes-file release/notes.md "${prerelease[@]}" \
            "release/ireko-$VERSION.tgz"
