# The standard npm release of mark1russell7/template, with the extra steps of ireko (RELEASING.md,
# and CI.md of the template).
#
#   verify    The gates of ci.yml: the checks, the package and the site.
#   build     reusable-release-build.yml of the template: stops when the commit is not on main,
#             builds and packs each published package (scripts/release/pack.mjs), and writes the
#             plan of the git tag and the GitHub release (scripts/release/tags.mjs). The plan
#             stops the release when packages/ireko/CHANGELOG.md has no section for the version.
#             The input after-pack tests the size and the tarball.
#   publish   The npm-publish action of the template: publishes each tarball whose version npm does
#             not have. Only this job holds "id-token: write", and it runs no code of the
#             repository: no checkout, no install.
#   tag       reusable-release-tag.yml of the template: makes the tag v<version> and the GitHub
#             release "ireko <version>", with the section of CHANGELOG.md and the tarball. Only this
#             job holds "contents: write", and it also runs no code of the repository.
#
# The publish job stays in this file. Only its steps are shared (the npm-publish action). npm
# trusted publishing matches the OIDC token of the run to the trusted publisher of each package:
# this repository and the workflow file release.yml. A shared workflow of a different repository can
# change what npm sees (CI.md of the template). A composite action runs in this job, so npm sees
# this file. The other jobs need no OIDC token, so they are shared workflows of the template.
# Renovate does not change this file: the release session moves its pins (RELEASING.md).
#
# A release: change the version in packages/ireko/package.json, add its section to
# packages/ireko/CHANGELOG.md, and merge both to main. The workflow also starts by hand
# (workflow_dispatch), for example after a failure. It skips each version that is already on npm,
# and each tag that exists. A release publishes only a commit on main: the first step of the build
# job stops a run on a commit that main does not have (RELEASING.md).
#
# npm trusted publishing uses the OIDC token of GitHub Actions: no npm token, and each version
# gets a provenance statement. The trusted publisher of ireko names the repository
# mark1russell7/ireko and the workflow file release.yml, with NO environment (npm refuses an
# environment for a repository with the immutable OIDC subject, npm/cli#9969). A version with a
# hyphen (0.2.0-beta.1) gets the dist-tag "next". The others get "latest".
#
# npm trusts a workflow only for a package that exists. The owner bootstraps a new package once:
# scripts/release/npm-bootstrap.mjs (RELEASING.md tells the procedure).
name: Release

on:
  push:
    branches: [main]
    paths: ["package.json", "packages/*/package.json"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build and pack
    needs: verify
    uses: mark1russell7/template/.github/workflows/reusable-release-build.yml@ee5e102d53ef913fc6dde60edce7d9f759c97c25 # main
    permissions:
      contents: read
    with:
      node-version-file: .nvmrc
      # The size limits of the built package, and the smoke test of the tarball that goes to npm.
      # pnpm writes the publishConfig entry points (dist/) into the packed package.json.
      after-pack: |
        pnpm size
        version="$(node -p 'require("./packages/ireko/package.json").version')"
        node packages/ireko/scripts/smoke.mjs --tarball "$RELEASE_DIR/ireko-$version.tgz"

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
    outputs:
      # The versions that this run published, "name@version" with a space between them
      published: ${{ steps.publish.outputs.published }}
    steps:
      # The action of the template, pinned to a commit. It runs in this job, so the OIDC token names
      # this repository and release.yml. It downloads the artifact "release" and publishes each
      # version that npm does not have, with provenance (.github/actions/npm-publish of the template).
      - id: publish
        uses: mark1russell7/template/.github/actions/npm-publish@ee5e102d53ef913fc6dde60edce7d9f759c97c25 # main

  tag:
    name: Git tag and GitHub release
    needs: [build, publish]
    # Also after a failed publish: each version that it published before the failure gets its tag.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: mark1russell7/template/.github/workflows/reusable-release-tag.yml@ee5e102d53ef913fc6dde60edce7d9f759c97c25 # main
    permissions:
      contents: write
    with:
      published: ${{ needs.publish.outputs.published }}
