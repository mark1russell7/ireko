# The time of the module of the router avoid. A throwaway branch: this workflow does not go to main.
name: Avoid time

on:
  workflow_dispatch:

permissions: {}

jobs:
  bench:
    name: Bench ${{ matrix.rep }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        rep: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Three fresh processes
        working-directory: packages/ireko
        run: |
          for p in 1 2 3; do node scripts/bench-avoid.mjs --out "avoid-${{ matrix.rep }}-$p.json"; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avoid-time-${{ matrix.rep }}
          path: packages/ireko/avoid-*.json
          retention-days: 90

  summary:
    name: Summary
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: avoid-time-*
          path: runs
      - run: node packages/ireko/scripts/bench-avoid-summary.mjs runs/*/avoid-*.json
